const CON13=["Duerme entre 7 y 9 horas: mientras duermes, tu cerebro ordena lo aprendido.","Haz pausas de 5 minutos cada hora: tu atención rinde más con descansos.","Bebe agua: una ligera deshidratación reduce la concentración.","Camina 20 a 30 minutos al día: el ejercicio mejora el flujo de sangre al cerebro.","Entrena en sesiones cortas y frecuentes: es mejor 10 minutos diarios que una hora por semana.","Repasa lo aprendido al día siguiente: el repaso espaciado fija los recuerdos.","Cambia de juego cada día: la variedad activa distintas áreas del cerebro.","Evita varias tareas a la vez: haz una cosa y hazla bien.","Respira hondo tres veces antes de un reto difícil para calmar los nervios.","Apaga las notificaciones mientras entrenas para proteger tu concentración.","Aprende algo nuevo cada semana: un idioma, un instrumento, una receta.","Lee unos minutos cada día: ejercita memoria, lenguaje e imaginación.","Cuando falles, mira por qué fallaste: ahí está tu mejor lección.","Al memorizar, crea una imagen o historia divertida: se recuerda más.","Agrupa los datos en bloques: es más fácil recordar 3 grupos que 9 cifras sueltas.","Come frutas, verduras y frutos secos: tu cerebro agradece una dieta variada.","Evita entrenar con mucho sueño: la calidad importa más que la cantidad.","Mira lejos de la pantalla cada 20 minutos durante 20 segundos para descansar la vista.","Estira el cuello y los hombros entre partidas.","Fíjate metas pequeñas y celebra cada una.","Explica en voz alta lo que aprendiste: enseñar fija el conocimiento.","Mantén una rutina: la hora fija ayuda a formar el hábito.","Juega con calma al inicio: la precisión primero, la velocidad después.","Si un juego te cuesta, baja un nivel y vuelve a subir: así se progresa.","Socializa: conversar y compartir también ejercita tu mente.","Ríe con amigos: reducir el estrés ayuda a la memoria.","Escribe tus pendientes: libera espacio mental para pensar mejor.","Practica la atención plena un minuto: observa tu respiración sin juzgar.","Usa la mano no dominante para tareas simples: es un reto para el cerebro.","Cambia el camino habitual de vez en cuando: el cerebro se activa con lo nuevo.","Escucha música y reconoce los instrumentos: entrena tu oído.","Haz cálculos mentales cuando compres: es un entrenamiento gratuito.","No compares tu velocidad con la de otros: cada cerebro tiene su ritmo.","Antes de un examen o reunión, repasa mentalmente lo más importante.","Duerme bien la noche antes de estudiar algo difícil y repásalo por la mañana.","Toma sol por las mañanas: ayuda a regular tu reloj interno y el sueño.","Evita las pantallas justo antes de dormir para dormir mejor.","Ponte una meta de partidas al día y cúmplela: la constancia gana.","Alterna juegos difíciles con juegos relajantes para no agotarte.","Cuando te frustres, levántate, camina un minuto y vuelve.","Dibuja mapas mentales para organizar ideas complejas.","Aprende de memoria un poema o una canción: entrena la memoria a largo plazo.","Juega ajedrez, dominó o cartas con otras personas: combinan estrategia y memoria.","Mide tu progreso cada semana, no cada partida.","Recuerda: un mal día no borra tu progreso.","Planifica tu día por bloques: así gastas menos energía en decidir.","Usa la técnica Pomodoro: 25 minutos de trabajo y 5 de descanso.","Sigue el método de los cinco pasos: mirar, pensar, responder, revisar, aprender.","Come despacio y sin pantallas: ejercitas la atención en lo cotidiano.","Haz ejercicio de fuerza dos veces por semana: también ayuda a la mente.","Fíjate en detalles de tu entorno al caminar: entrenas la observación.","Cuenta hacia atrás de 7 en 7 mentalmente: reto de cálculo y atención.","Inventa rimas con palabras nuevas: ejercitas el lenguaje.","Antes de una tarea larga, divídela en pasos pequeños.","Elige un lugar tranquilo y con buena luz para entrenar.","Cuando no recuerdes algo, no te desesperes: deja de pensar en ello y volverá solo.","Aprende los nombres de las personas repitiéndolos al conocerlas.","Mantén tu mente curiosa: haz una pregunta nueva cada día.","Agradece algo cada noche: el buen ánimo ayuda a aprender.","Aprovecha la mañana para tareas difíciles si es cuando mejor rindes.","Evita el exceso de cafeína: demasiado puede aumentar el nerviosismo.","Ordena tu espacio: un entorno limpio ayuda a concentrarte.","Marca con colores lo importante cuando estudies.","Practica la visualización: imagina el camino antes de recorrerlo.","Hazte preguntas sobre lo que lees: comprender es más que repetir.","Descansa los fines de semana: el cerebro también necesita vacaciones.","Pide ayuda cuando la necesites: aprender en equipo es más rápido.","Haz una lista de tus logros de la semana y léela cuando dudes.","Acepta el reto del nivel siguiente cuando superes 80 puntos varias veces.","Intenta resolver sin mirar las opciones y luego compara.","Primero entiende, luego memoriza.","Repite en voz alta los números que quieras recordar.","Ejercita los dos lados: haz juegos de lenguaje y de cálculo en el mismo día.","Usa tus sentidos al aprender: ver, oír, escribir y hablar a la vez.","Termina siempre tu sesión con algo que te guste: así querrás volver."];
const DAT13=["El cerebro humano adulto pesa alrededor de 1,4 kg.","El cerebro tiene unos 86.000 millones de neuronas.","Aunque pesa cerca del 2 % del cuerpo, el cerebro consume alrededor del 20 % de su energía.","Alrededor del 75 % del cerebro es agua.","Algunas neuronas transmiten impulsos a más de 100 metros por segundo.","El cerebro no tiene receptores del dolor: no siente dolor por sí mismo.","Mientras duermes, el cerebro refuerza y ordena los recuerdos del día.","La neuroplasticidad permite que el cerebro forme nuevas conexiones durante toda la vida.","Los taxistas de Londres mostraron una región del hipocampo, ligada a la memoria espacial, más desarrollada.","La memoria de trabajo suele manejar entre 4 y 7 elementos a la vez.","La corteza prefrontal sigue madurando hasta cerca de los 25 años.","Cada neurona puede conectarse con miles de otras mediante sinapsis.","Los dos hemisferios del cerebro se comunican a través del cuerpo calloso.","El cerebelo, que ayuda al equilibrio y la coordinación, contiene la mayoría de las neuronas del cerebro.","El ejercicio aeróbico favorece la memoria y la atención.","Aprender a tocar un instrumento activa a la vez zonas del oído, la vista y el movimiento.","El cerebro de un bebé casi duplica su tamaño durante el primer año de vida.","Los pliegues de la corteza cerebral permiten tener más superficie dentro del cráneo.","Bostezar y estirarse es normal al despertar: el cerebro cambia de estado de alerta.","El hipocampo, con forma parecida a un caballito de mar, es clave para formar nuevos recuerdos.","La amígdala cerebral participa en las emociones, sobre todo en el miedo.","Escuchar música que te gusta libera dopamina, una sustancia ligada al placer.","El cerebro humano usa señales eléctricas y químicas para comunicarse.","Los recuerdos no se guardan en un solo lugar: se reparten por varias áreas del cerebro.","La mielina es una capa grasa que ayuda a que los impulsos nerviosos viajen más rápido.","El cerebro se «limpia» de dese
