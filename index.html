 for(let i=0;i<q.length;i++){const[a,b]=q[i];for(const[dx,dy]of D){const x=a+dx,y=b+dy,s=x+','+y;if(!par.has(s)&&!'#SE'.includes(g[y][x])){par.set(s,[a,b]);q.push([x,y])}}}

{m:['##############','#P.r.R.b.B..E#','##############'],h:'Cada llave abre la puerta de su color'},

 if(t=='k'){const nx=x+dx,ny=y+dy,n=G.g[ny]&&G.g[ny][nx];if(G.en.some(e=>e.x==nx&&e.y==ny)||!(n=='.'||n=='~'))return;G.g[ny][nx]=n=='~'?'.':'k';G.g[y][x]='.';burst(x,y,'#c9a46a',6);beep(200,.08)}
